<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Organization - NexVote</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">🗳️ NexVote</div>
</header>

<section class="register">

<h1>Create Your Organization</h1>

<p>Register your institution or organization to start conducting secure elections.</p>

<form>

<input type="text" placeholder="Organization Name">

<select>
<option>Select Organization Type</option>
<option>University</option>
<option>College</option>
<option>Student Union (SUG)</option>
<option>FUSU / FIESU</option>
<option>NANS</option>
<option>Association</option>
<option>NGO</option>
<option>Other</option>
</select>

<input type="text" placeholder="Country">

<input type="text" placeholder="Institution (Optional)">

<input type="text" placeholder="Contact Person">

<input type="email" placeholder="Email Address">

<input type="tel" placeholder="Phone Number">

<input type="password" placeholder="Create Password">

<input type="password" placeholder="Confirm Password">


<button onclick="location.href='dashboard.html'">
Create Organization
</button>

</form>

</section>

</body>
</html>
