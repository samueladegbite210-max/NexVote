<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Election - NexVote</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #f3f4f6;
      margin: 0;
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #0D0D0D;
      color: white;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
    }

    .sidebar .logo {
      text-align: center;
      margin-bottom: 40px;
    }

    .sidebar .logo h2 {
      color: #D4AF37;
      font-size: 22px;
      font-weight: 700;
    }

    .sidebar .logo p {
      color: #F5D77A;
      font-size: 11px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      color: #d1d5db;
      text-decoration: none;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 15px;
      transition: all 0.2s;
    }

    .nav-link:hover,
    .nav-link.active {
      background: #1A1A1A;
      color: #D4AF37;
    }

    /* Main Content */
    .main {
      margin-left: 260px;
      flex: 1;
      padding: 30px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
    }

    .form-card {
      background: white;
      border-radius: 12px;
      padding: 32px;
      max-width: 700px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    @media (max-width: 900px) {
      .sidebar {
        display: none;
      }
      .main {
        margin-left: 0;
      }
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">
      <h2>NEXVOTE</h2>
      <p>Secure Elections. Trusted Results.</p>
    </div>

    <a href="dashboard.html" class="nav-link">Dashboard</a>
    <a href="elections.html" class="nav-link active">Elections</a>
    <a href="candidates.html" class="nav-link">Candidates</a>
    <a href="voters.html" class="nav-link">Voters</a>
    <a href="results.html" class="nav-link">Results</a>
    <a href="settings.html" class="nav-link">Settings</a>
    <a href="login.html" class="nav-link" style="margin-top: auto; color: #E53E3E;">Logout</a>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="header">
      <h1>Create Election</h1>
      <a href="elections.html" class="btn btn-outline">← Back</a>
    </div>

    <div class="form-card">
      <form id="createElectionForm">

        <div class="form-group">
          <label for="title">Election Title</label>
          <input type="text" id="title" class="form-control" placeholder="e.g. SUG Election 2024" required>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" class="form-control" rows="3" placeholder="Brief description of the election"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="startDate">Start Date</label>
            <input type="datetime-local" id="startDate" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="endDate">End Date</label>
            <input type="datetime-local" id="endDate" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label for="organization">Organization / Faculty</label>
          <input type="text" id="organization" class="form-control" placeholder="e.g. Student Union Government">
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" class="form-control">
            <option value="upcoming">Upcoming</option>
            <option value="ongoing">Ongoing</option>
            <option value="completed">Completed</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Create Election</button>
          <a href="elections.html" class="btn btn-outline">Cancel</a>
        </div>

      </form>
    </div>
  </div>

  <script src="js/elections.js"></script>
</body>
</html>
