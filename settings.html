<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - NexVote</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #f3f4f6;
      margin: 0;
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #0D0D0D;
      color: white;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
    }

    .sidebar .logo {
      text-align: center;
      margin-bottom: 40px;
    }

    .sidebar .logo h2 {
      color: #D4AF37;
      font-size: 22px;
      font-weight: 700;
    }

    .sidebar .logo p {
      color: #F5D77A;
      font-size: 11px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      color: #d1d5db;
      text-decoration: none;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 15px;
      transition: all 0.2s;
    }

    .nav-link:hover,
    .nav-link.active {
      background: #1A1A1A;
      color: #D4AF37;
    }

    /* Main Content */
    .main {
      margin-left: 260px;
      flex: 1;
      padding: 30px;
    }

    .header {
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .settings-card {
      background: white;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .settings-card h3 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f3f4f6;
    }

    .form-actions {
      margin-top: 10px;
    }

    .danger-zone {
      border: 1.5px solid #fecaca;
    }

    .danger-zone h3 {
      color: #E53E3E;
    }

    @media (max-width: 900px) {
      .sidebar {
        display: none;
      }
      .main {
        margin-left: 0;
      }
      .settings-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">
      <h2>NEXVOTE</h2>
      <p>Secure Elections. Trusted Results.</p>
    </div>

    <a href="dashboard.html" class="nav-link">Dashboard</a>
    <a href="elections.html" class="nav-link">Elections</a>
    <a href="candidates.html" class="nav-link">Candidates</a>
    <a href="voters.html" class="nav-link">Voters</a>
    <a href="results.html" class="nav-link">Results</a>
    <a href="settings.html" class="nav-link active">Settings</a>
    <a href="login.html" class="nav-link" style="margin-top: auto; color: #E53E3E;">Logout</a>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="header">
      <h1>Settings</h1>
    </div>

    <div class="settings-grid">

      <!-- Profile Settings -->
      <div class="settings-card">
        <h3>Profile Information</h3>
        <form>
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" class="form-control" value="John Doe">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-control" value="john.doe@school.edu">
          </div>
          <div class="form-group">
            <label>Role</label>
            <input type="text" class="form-control" value="Election Officer" disabled>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>

      <!-- Password Settings -->
      <div class="settings-card">
        <h3>Change Password</h3>
        <form>
          <div class="form-group">
            <label>Current Password</label>
            <input type="password" class="form-control" placeholder="Enter current password">
          </div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" class="form-control" placeholder="Enter new password">
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" class="form-control" placeholder="Confirm new password">
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Password</button>
          </div>
        </form>
      </div>

      <!-- Notification Settings -->
      <div class="settings-card">
        <h3>Notifications</h3>
        <form>
          <div class="form-group">
            <label>
              <input type="checkbox" checked> Email notifications for new elections
            </label>
          </div>
          <div class="form-group">
            <label>
              <input type="checkbox" checked> Email notifications for results
            </label>
          </div>
          <div class="form-group">
            <label>
              <input type="checkbox"> SMS notifications
            </label>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Preferences</button>
          </div>
        </form>
      </div>

      <!-- Danger Zone -->
      <div class="settings-card danger-zone">
        <h3>Danger Zone</h3>
        <p style="font-size:14px; color:#6b7280; margin-bottom:20px;">
          These actions are permanent and cannot be undone.
        </p>
        <button class="btn btn-danger">Delete Account</button>
      </div>

    </div>
  </div>

  <script src="js/settings.js"></script>
</body>
</html>
